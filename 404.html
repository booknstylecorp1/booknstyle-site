  <style>
    :root {
      --navy-900: #16182B;
      --navy-800: #1A1F36;
      --champagne: #C8956A;
      --champagne-light: #DFB990;
      --cream: #FAFAF7;
      --muted: rgba(250, 250, 247, .74);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 48px 16px;
      background:
        radial-gradient(50% 45% at 50% 18%, rgba(223, 185, 144, .15), transparent 72%),
        radial-gradient(60% 40% at 50% 110%, rgba(223, 185, 144, .08), transparent 70%),
        linear-gradient(180deg, var(--navy-900), var(--navy-800));
      color: var(--cream);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; }
    .mark { display: block; width: 64px; height: auto; margin: 0 auto 36px; }
    .code {
      margin: 0 0 14px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--champagne-light);
    }
    h1 {
      margin: 0;
      font-family: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(2.5rem, 1.6rem + 4vw, 4rem);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    h1 em { font-style: italic; font-weight: 400; color: var(--champagne); }
    p.lead { margin: 20px auto 0; max-width: 420px; color: var(--muted); font-size: 1.0625rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 36px;
      padding: 12px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #E6C7A2 0%, var(--champagne) 55%, #B98659 100%);
      color: var(--navy-900);
      font-weight: 600;
      font-size: .9375rem;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 10px 28px -14px rgba(200, 149, 106, .55);
    }
    .btn:hover { filter: brightness(1.05); }
    .help { margin-top: 28px; font-size: .875rem; color: var(--muted); }
    .help a { color: var(--champagne-light); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--champagne-light); outline-offset: 3px; }
  </style>
